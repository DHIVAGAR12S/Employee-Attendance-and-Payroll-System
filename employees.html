<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employees | Employee Attendance & Payroll System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-circle small"><i class="fa-solid fa-users"></i></div>
          <div>
            <h2>HR Suite</h2>
            <p>Admin Portal</p>
          </div>
        </div>
        <nav>
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
          <a class="nav-link active" href="employees.html"><i class="fa-solid fa-user-group"></i><span>Employees</span></a>
          <a class="nav-link" href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>Attendance</span></a>
          <a class="nav-link" href="leave.html"><i class="fa-solid fa-file-circle-exclamation"></i><span>Leave Management</span></a>
          <a class="nav-link" href="payroll.html"><i class="fa-solid fa-money-bill-wave"></i><span>Payroll</span></a>
          <a class="nav-link" href="reports.html"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
          <a class="nav-link" href="settings.html"><i class="fa-solid fa-sliders"></i><span>Settings</span></a>
          <a class="nav-link logout-link" href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <h1>Employee Management</h1>
            <p>Maintain employee profiles and status.</p>
          </div>
          <div class="topbar-actions">
            <button id="addEmployeeBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Employee</button>
          </div>
        </header>

        <main class="page-content">
          <section class="page-card">
            <div class="card-header">
              <h3>Employee Records</h3>
            </div>
            <div class="filters">
              <input id="employeeSearch" type="text" placeholder="Search employee" />
              <select id="departmentFilter">
                <option value="">All Departments</option>
              </select>
              <select id="statusFilter">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="On Leave">On Leave</option>
              </select>
            </div>
            <div id="employeeMessage" class="form-message"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="employeeTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="employeeModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Add Employee</h3>
          <button type="button" class="modal-close" id="closeModalBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="employeeForm" class="modal-form">
          <div class="grid-form">
            <div class="form-group"><label>Employee ID</label><input name="employeeId" required /></div>
            <div class="form-group"><label>Employee Name</label><input name="name" required /></div>
            <div class="form-group"><label>Email</label><input name="email" type="email" required /></div>
            <div class="form-group"><label>Phone Number</label><input name="phone" required /></div>
            <div class="form-group"><label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
            <div class="form-group"><label>Date of Birth</label><input name="dob" type="date" required /></div>
            <div class="form-group"><label>Department</label><input name="department" required /></div>
            <div class="form-group"><label>Designation</label><input name="designation" required /></div>
            <div class="form-group"><label>Date of Joining</label><input name="joiningDate" type="date" required /></div>
            <div class="form-group"><label>Basic Salary</label><input name="basicSalary" type="number" min="0" required /></div>
            <div class="form-group"><label>Employment Status</label><select name="status"><option>Active</option><option>Inactive</option><option>On Leave</option></select></div>
            <div class="form-group full"><label>Address</label><textarea name="address" rows="3"></textarea></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Employee</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/employees.js"></script>
  </body>
</html>
