<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Attendance & Payroll System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="brand-block">
          <div class="logo-circle"><i class="fa-solid fa-users"></i></div>
          <h1>Employee Attendance & Payroll System</h1>
          <p>Secure admin portal for attendance, leave, and salary management.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Username or Email</label>
            <input id="username" name="username" type="text" placeholder="Enter username" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input id="password" name="password" type="password" placeholder="Enter password" required />
              <button type="button" class="password-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" />
              <span>Remember me</span>
            </label>
          </div>

          <div id="loginMessage" class="form-message" role="alert"></div>
          <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <div class="demo-card">
          <p><strong>Demo credentials:</strong> admin / admin123</p>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
