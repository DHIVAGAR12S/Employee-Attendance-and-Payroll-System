<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Employee Attendance & Payroll System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-circle small"><i class="fa-solid fa-users"></i></div>
          <div>
            <h2>HR Suite</h2>
            <p>Admin Portal</p>
          </div>
        </div>
        <nav>
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
          <a class="nav-link" href="employees.html"><i class="fa-solid fa-user-group"></i><span>Employees</span></a>
          <a class="nav-link" href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>Attendance</span></a>
          <a class="nav-link" href="leave.html"><i class="fa-solid fa-file-circle-exclamation"></i><span>Leave Management</span></a>
          <a class="nav-link" href="payroll.html"><i class="fa-solid fa-money-bill-wave"></i><span>Payroll</span></a>
          <a class="nav-link" href="reports.html"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
          <a class="nav-link active" href="settings.html"><i class="fa-solid fa-sliders"></i><span>Settings</span></a>
          <a class="nav-link logout-link" href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <h1>Settings</h1>
            <p>Configure organization details and payroll preferences.</p>
          </div>
        </header>

        <main class="page-content">
          <section class="page-card">
            <div class="card-header">
              <h3>System Configuration</h3>
            </div>
            <form id="settingsForm" class="modal-form">
              <div class="grid-form">
                <div class="form-group"><label>Company Name</label><input name="companyName" /></div>
                <div class="form-group"><label>Company Email</label><input name="companyEmail" type="email" /></div>
                <div class="form-group"><label>Company Phone</label><input name="companyPhone" /></div>
                <div class="form-group"><label>Working Hours</label><input name="workingHours" /></div>
                <div class="form-group"><label>Currency</label><input name="currency" /></div>
                <div class="form-group full"><label>Company Address</label><textarea name="companyAddress" rows="3"></textarea></div>
                <div class="form-group full"><label>Payroll Settings</label><textarea name="payrollSettings" rows="3"></textarea></div>
              </div>
              <div class="modal-actions">
                <button type="submit" class="btn btn-primary">Save Settings</button>
              </div>
            </form>
            <div id="settingsMessage" class="form-message"></div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
