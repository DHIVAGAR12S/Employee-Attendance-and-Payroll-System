<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payroll | Employee Attendance & Payroll System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-circle small"><i class="fa-solid fa-users"></i></div>
          <div>
            <h2>HR Suite</h2>
            <p>Admin Portal</p>
          </div>
        </div>
        <nav>
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
          <a class="nav-link" href="employees.html"><i class="fa-solid fa-user-group"></i><span>Employees</span></a>
          <a class="nav-link" href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>Attendance</span></a>
          <a class="nav-link" href="leave.html"><i class="fa-solid fa-file-circle-exclamation"></i><span>Leave Management</span></a>
          <a class="nav-link active" href="payroll.html"><i class="fa-solid fa-money-bill-wave"></i><span>Payroll</span></a>
          <a class="nav-link" href="reports.html"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
          <a class="nav-link" href="settings.html"><i class="fa-solid fa-sliders"></i><span>Settings</span></a>
          <a class="nav-link logout-link" href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <h1>Payroll Management</h1>
            <p>Generate and manage employee salaries.</p>
          </div>
          <div class="topbar-actions">
            <button id="generatePayrollBtn" class="btn btn-primary"><i class="fa-solid fa-calculator"></i> Generate Payroll</button>
          </div>
        </header>

        <main class="page-content">
          <section class="page-card">
            <div class="card-header">
              <h3>Payroll Records</h3>
            </div>
            <div id="payrollMessage" class="form-message"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Month</th>
                    <th>Net Salary</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="payrollTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="payrollModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="payrollModalTitle">Create Payroll</h3>
          <button type="button" class="modal-close" id="closePayrollModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="payrollForm" class="modal-form">
          <div class="grid-form">
            <div class="form-group"><label>Employee ID</label><input name="employeeId" required /></div>
            <div class="form-group"><label>Employee Name</label><input name="employeeName" required /></div>
            <div class="form-group"><label>Department</label><input name="department" required /></div>
            <div class="form-group"><label>Month</label><input name="month" type="month" required /></div>
            <div class="form-group"><label>Basic Salary</label><input name="basicSalary" type="number" min="0" required /></div>
            <div class="form-group"><label>Allowance</label><input name="allowance" type="number" min="0" value="0" /></div>
            <div class="form-group"><label>Bonus</label><input name="bonus" type="number" min="0" value="0" /></div>
            <div class="form-group"><label>Overtime</label><input name="overtime" type="number" min="0" value="0" /></div>
            <div class="form-group"><label>Deductions</label><input name="deductions" type="number" min="0" value="0" /></div>
            <div class="form-group"><label>Leave Deduction</label><input name="leaveDeduction" type="number" min="0" value="0" /></div>
            <div class="form-group"><label>Payment Status</label><select name="paymentStatus"><option>Pending</option><option>Paid</option></select></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelPayrollModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Payroll</button>
          </div>
        </form>
      </div>
    </div>

    <div id="salarySlipModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Salary Slip</h3>
          <button type="button" class="modal-close" id="closeSlipModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="salarySlipBody" class="page-card inner-card"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="closeSlipBtn">Close</button>
          <button type="button" class="btn btn-primary" id="printSlipBtn"><i class="fa-solid fa-print"></i> Print Slip</button>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/payroll.js"></script>
  </body>
</html>
