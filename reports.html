<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | Employee Attendance & Payroll System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-circle small"><i class="fa-solid fa-users"></i></div>
          <div>
            <h2>HR Suite</h2>
            <p>Admin Portal</p>
          </div>
        </div>
        <nav>
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
          <a class="nav-link" href="employees.html"><i class="fa-solid fa-user-group"></i><span>Employees</span></a>
          <a class="nav-link" href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>Attendance</span></a>
          <a class="nav-link" href="leave.html"><i class="fa-solid fa-file-circle-exclamation"></i><span>Leave Management</span></a>
          <a class="nav-link" href="payroll.html"><i class="fa-solid fa-money-bill-wave"></i><span>Payroll</span></a>
          <a class="nav-link active" href="reports.html"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
          <a class="nav-link" href="settings.html"><i class="fa-solid fa-sliders"></i><span>Settings</span></a>
          <a class="nav-link logout-link" href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <h1>Reports</h1>
            <p>Filter and review HR statistics.</p>
          </div>
          <div class="topbar-actions">
            <button id="printReportBtn" class="btn btn-primary"><i class="fa-solid fa-print"></i> Print Report</button>
          </div>
        </header>

        <main class="page-content">
          <section class="page-card">
            <div class="filters">
              <select id="reportEmployeeFilter"><option value="">All Employees</option></select>
              <select id="reportDepartmentFilter"><option value="">All Departments</option></select>
              <input id="reportMonthFilter" type="month" />
              <input id="reportDateFilter" type="date" />
            </div>
            <div class="content-grid two-column">
              <article class="page-card inner-card">
                <div class="card-header"><h3>Attendance Summary</h3></div>
                <canvas id="reportAttendanceChart"></canvas>
              </article>
              <article class="page-card inner-card">
                <div class="card-header"><h3>Payroll Summary</h3></div>
                <canvas id="reportPayrollChart"></canvas>
              </article>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Employee</th><th>Department</th><th>Month</th><th>Status</th><th>Amount</th></tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/reports.js"></script>
  </body>
</html>
