<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Management | Employee Attendance & Payroll System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo-circle small"><i class="fa-solid fa-users"></i></div>
          <div>
            <h2>HR Suite</h2>
            <p>Admin Portal</p>
          </div>
        </div>
        <nav>
          <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
          <a class="nav-link" href="employees.html"><i class="fa-solid fa-user-group"></i><span>Employees</span></a>
          <a class="nav-link" href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>Attendance</span></a>
          <a class="nav-link active" href="leave.html"><i class="fa-solid fa-file-circle-exclamation"></i><span>Leave Management</span></a>
          <a class="nav-link" href="payroll.html"><i class="fa-solid fa-money-bill-wave"></i><span>Payroll</span></a>
          <a class="nav-link" href="reports.html"><i class="fa-solid fa-chart-line"></i><span>Reports</span></a>
          <a class="nav-link" href="settings.html"><i class="fa-solid fa-sliders"></i><span>Settings</span></a>
          <a class="nav-link logout-link" href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div>
            <h1>Leave Management</h1>
            <p>Review leave requests and update decisions.</p>
          </div>
          <div class="topbar-actions">
            <button id="addLeaveBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Leave Request</button>
          </div>
        </header>

        <main class="page-content">
          <section class="page-card">
            <div class="card-header">
              <h3>Leave Requests</h3>
            </div>
            <div id="leaveMessage" class="form-message"></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Employee</th>
                    <th>Type</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Days</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="leaveTableBody"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="leaveModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="leaveModalTitle">Leave Request</h3>
          <button type="button" class="modal-close" id="closeLeaveModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="leaveForm" class="modal-form">
          <div class="grid-form">
            <div class="form-group"><label>Employee ID</label><input name="employeeId" required /></div>
            <div class="form-group"><label>Employee Name</label><input name="employeeName" required /></div>
            <div class="form-group"><label>Leave Type</label><select name="leaveType"><option>Casual Leave</option><option>Sick Leave</option><option>Earned Leave</option><option>Unpaid Leave</option></select></div>
            <div class="form-group"><label>Number of Days</label><input name="days" type="number" min="1" required /></div>
            <div class="form-group"><label>From Date</label><input name="fromDate" type="date" required /></div>
            <div class="form-group"><label>To Date</label><input name="toDate" type="date" required /></div>
            <div class="form-group full"><label>Reason</label><textarea name="reason" rows="3"></textarea></div>
            <div class="form-group"><label>Status</label><select name="status"><option>Pending</option><option>Approved</option><option>Rejected</option></select></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelLeaveModal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Request</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/leave.js"></script>
  </body>
</html>
